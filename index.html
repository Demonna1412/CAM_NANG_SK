<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cẩm nang sự kiện</title>
  <style>
    :root {
      --navy: #0f2b46;
      --blue: #1a73e8;
      --gold: #c9a24b;
      --gold-dark: #8f6b1c;
      --bg: #f6f5f2;
      --card: #fff;
      --text: #1d1d1f;
      --muted: #5f6670;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; scroll-padding-top: 70px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    a { -webkit-tap-highlight-color: transparent; }

    /* Thanh điều hướng */
    .nav { position: sticky; top: 0; z-index: 20; background: var(--navy); box-shadow: 0 2px 12px rgba(0, 0, 0, .18); }
    .nav-inner { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; max-width: 1100px; margin: 0 auto; scrollbar-width: none; }
    .nav-inner::-webkit-scrollbar { display: none; }
    .nav a {
      flex: 0 0 auto;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      white-space: nowrap;
      transition: background .2s, color .2s;
    }
    .nav a:hover, .nav a.on { background: var(--gold); color: var(--navy); }

    /* Đầu trang */
    .hero {
      position: relative;
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      background: var(--navy);
      overflow: hidden;
    }
    @media (min-width: 900px) { .hero { min-height: 80vh; } }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.1);
      transition: opacity 1.6s ease, transform 14s ease-out;
    }
    .hero-bg.loaded { opacity: .5; transform: scale(1); }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 43, 70, .35), rgba(15, 43, 70, .92));
    }
    .hero-content { position: relative; z-index: 1; padding: 56px 22px; max-width: 880px; width: 100%; }
    .hero-content > * { opacity: 0; }
    .hero-content.ready > * { animation: fadeUp .9s ease forwards; }
    .hero-content.ready > :nth-child(1) { animation-delay: .1s; }
    .hero-content.ready > :nth-child(2) { animation-delay: .25s; }
    .hero-content.ready > :nth-child(3) { animation-delay: .4s; }
    .hero-content.ready > :nth-child(4) { animation-delay: .55s; }
    .hero-content.ready > :nth-child(5) { animation-delay: .7s; }
    .eyebrow { letter-spacing: 4px; font-size: 12px; color: var(--gold); font-weight: 700; margin-bottom: 14px; }
    .hero h1 { font-size: clamp(30px, 7vw, 62px); line-height: 1.12; margin-bottom: 12px; }
    .subtitle { font-size: clamp(16px, 2.4vw, 21px); opacity: .92; margin-bottom: 18px; }
    .meta { font-size: clamp(15px, 2vw, 17px); font-weight: 600; margin-bottom: 10px; }
    .audience { font-size: 14px; opacity: .82; }

    /* Nội dung chung */
    section { padding: 60px 0; }
    section.alt { background: #fff; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 18px; }
    h2.sec { color: var(--navy); text-align: center; font-size: clamp(24px, 4vw, 34px); line-height: 1.2; }
    h2.sec::after { content: ""; display: block; width: 48px; height: 3px; background: var(--gold); margin: 12px auto 34px; border-radius: 2px; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 22px; } }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      border-top: 4px solid var(--gold);
      box-shadow: 0 2px 14px rgba(0, 0, 0, .06);
      display: flex;
      flex-direction: column;
    }
    section.alt .card { background: var(--bg); }
    .thumb { position: relative; aspect-ratio: 4/3; background: #eceae4; cursor: zoom-in; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
    .thumb:hover img { transform: scale(1.04); }
    .thumb-hint {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: rgba(15, 43, 70, .78);
      color: #fff;
      font-size: 12px;
      padding: 4px 11px;
      border-radius: 999px;
      pointer-events: none;
      opacity: .9;
    }
    .video-box { position: relative; aspect-ratio: 16/9; background: #0b1623; overflow: hidden; }
    .video-box iframe, .video-box video { width: 100%; height: 100%; border: 0; display: block; }

    .card-body { padding: 18px 20px 20px; flex: 1; }
    .card h3 { color: var(--navy); font-size: 18px; line-height: 1.35; }
    .fields { margin-top: 6px; }
    .field { margin-top: 10px; font-size: 15px; }
    .label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; }
    .field ul { padding-left: 18px; }
    .field li { margin: 3px 0; }
    .muted { color: var(--muted); text-align: center; }

    /* Lịch trình: timeline trục dọc tối giản (giờ trái - chấm & trục giữa - nội dung phải) */
    .vtl {
      max-width: 780px;
      margin: 0 auto;
      background: #fff;
      border-radius: var(--radius);
      padding: 28px 26px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, .05);
    }
    .vtl-item {
      display: grid;
      grid-template-columns: 122px 24px 1fr;
      gap: 0 16px;
      align-items: start;
    }
    .vtl-time {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      padding-top: 2px;
      line-height: 1.4;
    }
    .vtl-rail {
      position: relative;
      display: flex;
      justify-content: center;
      align-self: stretch;
    }
    .vtl-rail::before {
      content: "";
      position: absolute;
      top: 10px;
      bottom: -10px;
      left: 50%;
      width: 2px;
      transform: translateX(-50%);
      background: #d8dce3;
    }
    .vtl-item:last-child .vtl-rail::before { display: none; }
    .vtl-dot {
      position: relative;
      z-index: 1;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--blue);
      margin-top: 5px;
      box-shadow: 0 0 0 4px rgba(26, 115, 232, .14);
      flex-shrink: 0;
    }
    .vtl-body {
      padding-bottom: 24px;
    }
    .vtl-item:last-child .vtl-body { padding-bottom: 0; }
    .vtl-title {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.35;
    }
    .vtl-desc {
      margin-top: 4px;
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.5;
    }
    .vtl-desc ul { padding-left: 16px; margin-top: 2px; }
    .vtl-desc li { margin: 2px 0; }
    @media (max-width: 560px) {
      .vtl { padding: 20px 14px; }
      .vtl-item { grid-template-columns: 90px 20px 1fr; gap: 0 10px; }
      .vtl-time { font-size: 12.5px; }
      .vtl-title { font-size: 15px; }
      .vtl-desc { font-size: 13.5px; }
    }

    /* Nội dung chính: phong cách editorial xen kẽ trái - phải (tham khảo Sneaker Con) */
    .editorial-list {
      display: flex;
      flex-direction: column;
      gap: 44px;
    }
    .ed-item {
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: center;
    }
    .ed-media {
      width: 100%;
      display: flex;
      justify-content: center;
      background: transparent;
    }
    .ed-media .thumb {
      display: inline-block;
      aspect-ratio: auto;
      max-width: 100%;
      background: transparent;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 43, 70, .10);
    }
    .ed-media .thumb img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 500px;
      object-fit: initial;
    }
    .ed-media .thumb:hover img {
      transform: scale(1.02);
    }
    .ed-media .video-box {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 43, 70, .10);
    }
    .ed-text {
      width: 100%;
    }
    .ed-item:not(.has-media) {
      background: var(--bg);
      border-radius: 18px;
      padding: 26px 28px;
      border-left: 4px solid var(--gold);
      align-items: flex-start;
    }
    .ed-kicker {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--gold-dark);
      margin-bottom: 8px;
    }
    .ed-text h3 {
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.22;
      margin-bottom: 12px;
    }
    .ed-text p {
      font-size: 16px;
      color: #36393f;
      line-height: 1.65;
    }
    .ed-text ul {
      margin-top: 8px;
      padding-left: 20px;
      font-size: 16px;
      color: #36393f;
      line-height: 1.7;
    }
    .ed-text li { margin: 4px 0; }
    @media (min-width: 820px) {
      .editorial-list { gap: 56px; }
      .ed-item.has-media {
        flex-direction: row;
        gap: 44px;
      }
      .ed-item.has-media.flip {
        flex-direction: row-reverse;
      }
      .ed-item.has-media .ed-media {
        flex: 0 0 52%;
      }
      .ed-item.has-media .ed-text {
        flex: 1;
      }
    }

    /* Xem ảnh phóng to */
    .lb {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
      cursor: zoom-out;
    }
    .lb img { max-width: 100%; max-height: 92vh; object-fit: contain; border-radius: 8px; }

    .status { text-align: center; padding: 80px 20px; color: var(--muted); }
    footer { background: var(--navy); color: #fff; text-align: center; padding: 28px 18px; font-size: 14px; }
    footer a { color: var(--gold); text-decoration: none; }

    /* Hiệu ứng */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.show { opacity: 1; transform: none; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
      .hero-content > * { opacity: 1; }
      .reveal { opacity: 1; transform: none; }
      .hero-bg { opacity: .5; transform: none; }
    }
  </style>
</head>
<body>
  <header class="hero" id="top">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-content" id="hero-content">
      <p class="eyebrow">CẨM NANG SỰ KIỆN</p>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
      <p class="meta" id="meta"></p>
      <p class="audience" id="audience"></p>
    </div>
  </header>

  <p class="status" id="status">Đang tải nội dung...</p>
  <nav class="nav" id="nav" hidden><div class="nav-inner" id="nav-inner"></div></nav>
  <main id="main" hidden></main>

  <footer>
    <p>Tài liệu nội bộ, không chia sẻ ra bên ngoài.</p>
    <p style="margin-top:8px"><a href="#top">↑ Về đầu trang</a></p>
  </footer>

  <script>
    /* ===== Đã gắn sẵn ID Google Sheet "Cẩm nang sự kiện 14-11" ===== */
    const SHEET_ID = "16eXAq-5v8ZVEKPgEG4QRhY2eC6l22pFkz6JrBT6Bpa0";
    /* =============================================================== */

    // Mỗi tab trong Sheet là một mục trên trang, theo đúng thứ tự này
    const SECTIONS = [
      { tab: "Lịch trình", title: "Lịch trình", layout: "vtl" },
      { tab: "Nội dung chính", title: "Nội dung chính", layout: "editorial" },
      { tab: "Khu trải nghiệm", title: "Khu trải nghiệm" },
      { tab: "Ẩm thực", title: "Ẩm thực & combo" },
      { tab: "Chính sách", title: "Chính sách bán hàng" },
      { tab: "Lưu ý", title: "Lưu ý cho CVKD" }
    ];

    const $ = id => document.getElementById(id);

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      return e;
    }

    function sheetUrl(tab) {
      return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(tab)}`;
    }

    async function readTab(tab) {
      const res = await fetch(sheetUrl(tab));
      if (!res.ok) throw new Error(`Không đọc được tab "${tab}"`);
      const raw = await res.text();
      const data = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
      const headers = data.table.cols.map(c => (c.label || "").trim());
      return data.table.rows
        .map(row => {
          const obj = {};
          headers.forEach((h, i) => {
            const cell = row.c[i];
            obj[h] = cell ? String(cell.f ?? cell.v ?? "").trim() : "";
          });
          return obj;
        })
        .filter(obj => Object.values(obj).some(v => v !== ""));
    }

    function driveFileId(url) {
      if (!url || !url.includes("drive.google.com")) return "";
      const m = url.match(/\/d\/([\w-]+)/) || url.match(/[?&]id=([\w-]+)/);
      return m ? m[1] : "";
    }

    // Link ảnh Google Drive (chia sẻ "bất kỳ ai có link") -> link hiển thị được
    function imgUrl(url) {
      if (!url) return "";
      const id = driveFileId(url);
      if (id) return `https://lh3.googleusercontent.com/d/${id}=w1600`;
      return url;
    }

    // Nhận diện link video (YouTube, MP4/WebM, hoặc Google Drive video)
    function parseVideo(url, forceDriveVideo = false) {
      if (!url) return null;
      const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
      if (yt) {
        return { type: "iframe", src: `https://www.youtube.com/embed/${yt[1]}?rel=0` };
      }
      if (/\.(mp4|webm|mov|m4v)(\?|$)/i.test(url)) {
        return { type: "video", src: url };
      }
      const dId = driveFileId(url);
      if (dId && (forceDriveVideo || /\/preview(\?|$)/i.test(url))) {
        return { type: "iframe", src: `https://drive.google.com/file/d/${dId}/preview` };
      }
      return null;
    }

    function videoNode(v, title) {
      const box = el("div", "video-box");
      if (v.type === "video") {
        const vid = el("video");
        vid.src = v.src;
        vid.controls = true;
        vid.playsInline = true;
        vid.preload = "metadata";
        box.appendChild(vid);
      } else {
        const ifr = el("iframe");
        ifr.src = v.src;
        ifr.title = title || "Video";
        ifr.loading = "lazy";
        ifr.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        ifr.allowFullscreen = true;
        box.appendChild(ifr);
      }
      return box;
    }

    // Tách các ý trong ô bằng dấu ";"
    function splitList(s) {
      return (s || "").split(";").map(x => x.trim()).filter(Boolean);
    }

    function field(label, value) {
      const wrap = el("div", "field");
      wrap.appendChild(el("span", "label", label));
      const parts = splitList(value);
      if (parts.length > 1) {
        const ul = el("ul");
        parts.forEach(t => ul.appendChild(el("li", "", t)));
        wrap.appendChild(ul);
      } else {
        wrap.appendChild(el("span", "", parts[0] || value));
      }
      return wrap;
    }

    function openLightbox(src, alt) {
      const lb = el("div", "lb");
      const img = el("img");
      img.src = src;
      img.alt = alt;
      lb.appendChild(img);
      function close() {
        lb.remove();
        document.removeEventListener("keydown", onKey);
      }
      function onKey(e) { if (e.key === "Escape") close(); }
      lb.addEventListener("click", close);
      document.addEventListener("keydown", onKey);
      document.body.appendChild(lb);
    }

    function thumb(src, alt, showHint = false) {
      const box = el("div", "thumb");
      const img = el("img");
      img.src = src;
      img.alt = alt;
      img.loading = "lazy";
      img.onerror = () => { box.hidden = true; };
      box.appendChild(img);
      if (showHint) box.appendChild(el("span", "thumb-hint", "Phóng to"));
      box.addEventListener("click", () => openLightbox(src, alt));
      return box;
    }

    function buildMedia(row, title, showHint = false) {
      const rawVideo = row["Video"] || "";
      const rawImg = row["Ảnh"] || "";
      const vFromCol = parseVideo(rawVideo, true);
      if (vFromCol) return videoNode(vFromCol, title);
      const vFromImg = parseVideo(rawImg, false);
      if (vFromImg) return videoNode(vFromImg, title);
      const photo = rawImg ? imgUrl(rawImg) : "";
      if (photo) return thumb(photo, title, showHint);
      return null;
    }

    // Timeline trục dọc tối giản cho phần Lịch trình
    function buildVerticalTimeline(rows) {
      const wrap = el("div", "vtl reveal");
      rows.forEach(r => {
        const entries = Object.entries(r);
        const time = r["Thời gian"] || entries[0]?.[1] || "";
        const title = r["Hạng mục"] || entries[1]?.[1] || "";
        const detail = r["Nội dung chi tiết"] || r["Nội dung"] || entries[2]?.[1] || "";

        const item = el("div", "vtl-item");
        item.appendChild(el("div", "vtl-time", time));

        const rail = el("div", "vtl-rail");
        rail.appendChild(el("span", "vtl-dot"));
        item.appendChild(rail);

        const body = el("div", "vtl-body");
        body.appendChild(el("div", "vtl-title", title));
        if (detail) {
          const desc = el("div", "vtl-desc");
          const parts = splitList(detail);
          if (parts.length > 1) {
            const ul = el("ul");
            parts.forEach(t => ul.appendChild(el("li", "", t)));
            desc.appendChild(ul);
          } else {
            desc.textContent = parts[0] || detail;
          }
          body.appendChild(desc);
        }
        item.appendChild(body);
        wrap.appendChild(item);
      });
      return wrap;
    }

    // Phong cách editorial xen kẽ trái - phải cho phần Nội dung chính
    function buildEditorial(rows) {
      const list = el("div", "editorial-list");
      let mediaCount = 0;

      rows.forEach((row, index) => {
        const entries = Object.entries(row);
        const time = row["Thời gian"] || "";
        const title = row["Hạng mục"] || entries[0]?.[1] || "";
        const detail = row["Chi tiết"] || "";

        const item = el("article", "ed-item reveal");
        item.style.transitionDelay = `${Math.min(index, 6) * 80}ms`;

        const media = buildMedia(row, title, true);
        if (media) {
          item.classList.add("has-media");
          if (mediaCount % 2 === 1) item.classList.add("flip");
          mediaCount++;
          const mBox = el("div", "ed-media");
          mBox.appendChild(media);
          item.appendChild(mBox);
        }

        const text = el("div", "ed-text");
        if (time) text.appendChild(el("span", "ed-kicker", time));
        if (title) text.appendChild(el("h3", "", title));

        if (detail) {
          const parts = splitList(detail);
          if (parts.length > 1) {
            const ul = el("ul");
            parts.forEach(t => ul.appendChild(el("li", "", t)));
            text.appendChild(ul);
          } else {
            text.appendChild(el("p", "", parts[0] || detail));
          }
        }

        const extra = el("div", "fields");
        entries.forEach(([label, value]) => {
          if (!["Thời gian", "Hạng mục", "Chi tiết", "Ảnh", "Video"].includes(label) && value) {
            extra.appendChild(field(label, value));
          }
        });
        if (extra.children.length) text.appendChild(extra);

        item.appendChild(text);
        list.appendChild(item);
      });
      return list;
    }

    // Thẻ chuẩn (Khu trải nghiệm, Ẩm thực, Chính sách, Lưu ý)
    function card(row, index) {
      const entries = Object.entries(row);
      const title = entries[0][1];
      const c = el("article", "card reveal");
      c.style.transitionDelay = `${Math.min(index, 8) * 90}ms`;

      const media = buildMedia(row, title, false);
      if (media) c.appendChild(media);

      const body = el("div", "card-body");
      body.appendChild(el("h3", "", title));
      const fields = el("div", "fields");
      entries.slice(1).forEach(([label, value]) => {
        if (label !== "Ảnh" && label !== "Video" && value) {
          fields.appendChild(field(label, value));
        }
      });
      body.appendChild(fields);
      c.appendChild(body);
      return c;
    }

    function renderHero(kv) {
      document.title = kv["Tiêu đề"] || "Cẩm nang sự kiện";
      $("title").textContent = kv["Tiêu đề"] || "";
      $("subtitle").textContent = kv["Phụ đề"] || "";
      $("meta").textContent = [kv["Ngày"], kv["Thời gian"], kv["Địa điểm"]].filter(Boolean).join(" · ");
      $("audience").textContent = kv["Đối tượng"] ? `Dành cho: ${kv["Đối tượng"]}` : "";

      const bg = imgUrl(kv["Ảnh nền"]);
      if (bg) {
        // Chỉ hiện ảnh nền khi đã tải xong để animation mượt
        const probe = new Image();
        probe.onload = () => {
          $("hero-bg").style.backgroundImage = `url("${bg}")`;
          $("hero-bg").classList.add("loaded");
        };
        probe.src = bg;
      }
    }

    function buildSections(dataList) {
      const navInner = $("nav-inner");
      const main = $("main");
      SECTIONS.forEach((s, i) => {
        const id = `sec-${i}`;
        const link = el("a", "", s.title);
        link.href = `#${id}`;
        navInner.appendChild(link);

        const sec = el("section", i % 2 === 1 ? "alt" : "");
        sec.id = id;
        const wrap = el("div", "wrap");
        wrap.appendChild(el("h2", "sec reveal", s.title));

        const rows = dataList[i];
        if (rows.length) {
          if (s.layout === "vtl") {
            wrap.appendChild(buildVerticalTimeline(rows));
          } else if (s.layout === "editorial") {
            wrap.appendChild(buildEditorial(rows));
          } else {
            const grid = el("div", "grid");
            rows.forEach((r, j) => grid.appendChild(card(r, j)));
            wrap.appendChild(grid);
          }
        } else {
          wrap.appendChild(el("p", "muted", "Chưa có nội dung."));
        }
        sec.appendChild(wrap);
        main.appendChild(sec);
      });
    }

    // Đánh dấu mục đang xem trên thanh điều hướng
    function highlightNav() {
      const links = [...document.querySelectorAll(".nav a")];
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === `#${e.target.id}`));
          }
        });
      }, { rootMargin: "-45% 0px -50% 0px" });
      document.querySelectorAll("main section").forEach(s => io.observe(s));
    }

    function revealOnScroll() {
      const io = new IntersectionObserver((entries, obs) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add("show");
            obs.unobserve(e.target);
          }
        });
      }, { threshold: 0.12 });
      document.querySelectorAll(".reveal").forEach(node => io.observe(node));
    }

    async function init() {
      if (SHEET_ID.startsWith("DAN_")) {
        $("status").textContent = "Chưa cấu hình ID Google Sheet.";
        return;
      }
      try {
        const tabs = ["Thông tin", ...SECTIONS.map(s => s.tab)];
        const [infoRows, ...dataList] = await Promise.all(tabs.map(readTab));
        const kv = {};
        infoRows.forEach(r => { if (r["Mục"]) kv[r["Mục"]] = r["Nội dung"]; });

        renderHero(kv);
        buildSections(dataList);

        $("status").hidden = true;
        $("nav").hidden = false;
        $("main").hidden = false;
        $("hero-content").classList.add("ready");
        highlightNav();
        revealOnScroll();
      } catch (err) {
        console.error(err);
        $("status").textContent = "Chưa tải được nội dung. Vui lòng thử lại sau.";
      }
    }

    init();
  </script>
</body>
</html>
